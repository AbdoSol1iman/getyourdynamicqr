name: Build and deploy Node.js app to Azure Web App - getyourdynamicqr-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Run tests
        working-directory: backend
        run: npm test --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3BF87F7246684489A47C99507D803761 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3F330CA2ECD14CA9B0DD0E368F7011E8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_918884B5ABB742B5B8DF393889655968 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "getyourdynamicqr-api"
          slot-name: "Production"
          package: backend
