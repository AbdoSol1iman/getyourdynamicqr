name: Build and deploy Node.js app to Azure Web App - getyourdynamicqr-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
        run: npx prisma generate

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend.zip .

      - name: Deploy with Kudu ZipDeploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_22739EA2D8B24A09BEC8EA2023B400D1 }}
        run: |
          set -euo pipefail
          PROFILE_FILE="$(mktemp)"
          printf '%s' "$PUBLISH_PROFILE" > "$PROFILE_FILE"

          PROFILE_LINE="$(grep -o '<publishProfile[^>]*/>' "$PROFILE_FILE" | grep -m1 -E 'publishMethod=\"(ZipDeploy|MSDeploy)\"')"
          if [ -z "${PROFILE_LINE:-}" ]; then
            echo "Could not find a usable publish profile entry."
            exit 1
          fi

          PUBLISH_URL="$(echo "$PROFILE_LINE" | grep -o 'publishUrl=\"[^\"]*\"' | head -n1 | cut -d'"' -f2)"
          USER_NAME="$(echo "$PROFILE_LINE" | grep -o 'userName=\"[^\"]*\"' | head -n1 | cut -d'"' -f2)"
          USER_PASSWORD="$(echo "$PROFILE_LINE" | grep -o 'userPWD=\"[^\"]*\"' | head -n1 | cut -d'"' -f2)"

          if [ -z "${PUBLISH_URL:-}" ] || [ -z "${USER_NAME:-}" ] || [ -z "${USER_PASSWORD:-}" ]; then
            echo "Publish profile does not contain complete deployment credentials."
            exit 1
          fi

          KUDU_HOST="${PUBLISH_URL%%:*}"
          if [ "$KUDU_HOST" = "$PUBLISH_URL" ]; then
            KUDU_HOST="$PUBLISH_URL"
          fi
          KUDU_ZIPDEPLOY_URL="https://${KUDU_HOST}/api/zipdeploy?isAsync=true"

          RESPONSE_HEADERS="$(mktemp)"
          curl --fail --show-error --silent \
            --user "${USER_NAME}:${USER_PASSWORD}" \
            --data-binary "@backend.zip" \
            --header "Content-Type: application/zip" \
            --dump-header "$RESPONSE_HEADERS" \
            --request POST \
            "$KUDU_ZIPDEPLOY_URL" >/dev/null

          POLL_URL="$(awk 'BEGIN{IGNORECASE=1}/^Location:/{print $2}' "$RESPONSE_HEADERS" | tr -d '\r' | tail -n1)"
          if [ -z "${POLL_URL:-}" ]; then
            POLL_URL="https://${KUDU_HOST}/api/deployments/latest"
          fi

          for i in $(seq 1 30); do
            STATUS_JSON="$(curl --fail --show-error --silent --user "${USER_NAME}:${USER_PASSWORD}" "$POLL_URL")"
            STATUS="$(echo "$STATUS_JSON" | grep -o '\"status\"[[:space:]]*:[[:space:]]*[0-9]*' | head -n1 | cut -d: -f2 | tr -d ' ')"

            if [ "$STATUS" = "4" ]; then
              echo "ZipDeploy completed successfully."
              exit 0
            fi
            if [ "$STATUS" = "3" ]; then
              echo "ZipDeploy failed."
              echo "$STATUS_JSON"
              exit 1
            fi

            sleep 5
          done

          echo "ZipDeploy did not complete within timeout."
          exit 1
