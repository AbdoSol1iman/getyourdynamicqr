name: Build and deploy Node.js app to Azure Web App - getyourdynamicqr-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend

      - name: Resolve deployment target from publish profile
        id: resolve-target
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_22739EA2D8B24A09BEC8EA2023B400D1 }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          profile_xml = os.environ["AZURE_WEBAPP_PUBLISH_PROFILE"]
          root = ET.fromstring(profile_xml)
          publish_profiles = root.findall("publishProfile")
          msdeploy_profile = next(
              (profile for profile in publish_profiles if profile.attrib.get("publishMethod") == "MSDeploy"),
              publish_profiles[0],
          )
          username = msdeploy_profile.attrib.get("userName", "").lstrip("$")
          app_name, _, slot_name = username.partition("__")
          slot_name = slot_name or "production"

          if not app_name:
              raise SystemExit("Unable to parse app name from Azure publish profile userName.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"app-name={app_name}\n")
              output.write(f"slot-name={slot_name}\n")
          PY

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve-target.outputs.app-name }}
          slot-name: ${{ steps.resolve-target.outputs.slot-name }}
          package: backend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_22739EA2D8B24A09BEC8EA2023B400D1 }}
